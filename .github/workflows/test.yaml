name: Test
on:
  pull_request:
    branches:
    - '**'
  push:
    branches:
    - master
jobs:
  test:
    name: Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
    steps:
    - name: Checkout hub
      uses: actions/checkout@v7
      with:
        path: hub
    - name: Checkout fabric-http (sibling for file:../fabric-http layouts)
      uses: actions/checkout@v7
      with:
        repository: FabricLabs/fabric-http
        ref: feature/rsi
        path: fabric-http
    - name: Install Node.js on ${{ matrix.os }}
      uses: actions/setup-node@v7
      with:
        # Checkout uses path: hub, so .nvmrc is hub/.nvmrc (not repo root).
        node-version-file: 'hub/.nvmrc'
        cache: 'npm'
        cache-dependency-path: hub/package-lock.json
    - name: Install dependencies
      run: npm ci
      working-directory: hub
    # browser.interface + Sandbox use Puppeteer; macOS (and some Linux) runners need an explicit browser binary (see e2e-rc.yml)
    - name: Install Chrome for Puppeteer
      run: npx puppeteer browsers install chrome
      working-directory: hub
    - name: Generate coverage report
      run: npm run report:coverage
      working-directory: hub
    - name: Mainnet RPC smoke script (no-op in CI unless FABRIC_MAINNET_RPC_SMOKE=1)
      run: npm run test:smoke-mainnet-rpc
      working-directory: hub
    - name: Send coverage report
      # Pin full commit SHA (Codacy: third-party actions must be immutable).
      # Tag v7 → commit below (codecov/codecov-action@v7.0.0).
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        directory: ./hub/reports/
      # v4+ prefers a token even on public repos, so a tokenless upload can be
      # rate-limited. Coverage is reporting, not a gate: match the `@fabric/core`
      # workflows and never fail the build on it.
      continue-on-error: true
