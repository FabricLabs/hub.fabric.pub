# Release gate: browser build + unit tests (see docs/PRODUCTION.md)
name: CI

on:
  push:
    branches: [main, master, develop, 'feature/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: hub
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FabricLabs/fabric-http
          ref: feature/rsi
          path: fabric-http
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'hub/.nvmrc'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
        working-directory: hub
      - run: npm run ci
        working-directory: hub
