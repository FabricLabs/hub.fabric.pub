# Codacy — reduce noise on generated / vendor / report trees (PR #15 100-issue cap).
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# Operator path/SSRF helpers that Semgrep flags live under `libs/hub-operator/`
# (Codacy's default ignore includes `.*libs/.*`). `functions/*.js` keep thin
# re-exports so require paths stay stable. Do not move them back under
# `functions/` without a Codacy UI mute — engine `exclude_paths` has not been
# honoured on this PR's annotations.
---
engines:
  remark-lint:
    enabled: false
  semgrep:
    enabled: true
    exclude_paths:
      - 'functions/hubLightningGate.js'
      - 'libs/hub-operator/**'
  opengrep:
    enabled: true
    exclude_paths:
      - 'functions/hubLightningGate.js'
      - 'libs/hub-operator/**'
exclude_paths:
  - 'assets/**'
  - 'libraries/**'
  - 'libs/**'
  - 'reports/**'
  - 'docs/**'
  - 'tests/**'
  - 'scripts/**'
  - 'extension/vendor/**'
  - 'coverage/**'
  - 'SECURITY.md'
  - 'AUDIT.md'
